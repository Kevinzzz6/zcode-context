<!doctype html>
<!--
  Framed README screenshots, rendered by docs/images/src/render.sh.
  Query: img=<raw shot URL>, crop=<source px height>, theme=light|dark.
  Window size is 452 x (crop / 2 + 32) at device scale factor 2.
-->
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { background: transparent; overflow: hidden; }
  .frame { width: 452px; padding: 16px; border-radius: 22px;
    background: linear-gradient(180deg, #f7f8fb 0%, #edf0f5 100%);
    box-shadow: inset 0 0 0 1px rgba(16,24,40,.09), inset 0 1px 0 #fff; }
  .view { --panel: #fff; position: relative; width: 420px; overflow: hidden; border-radius: 13px; background: var(--panel);
    box-shadow: 0 0 0 1px rgba(16,24,40,.07), 0 1px 2px rgba(16,24,40,.06), 0 10px 26px -10px rgba(16,24,40,.22); }
  .dark .frame { background: radial-gradient(420px 260px at 18% 0%, rgba(99,102,241,.10), transparent 70%), linear-gradient(180deg, #1d212a 0%, #14171d 100%);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.07), inset 0 1px 0 rgba(255,255,255,.06); }
  .dark .view { --panel: #17181c; box-shadow: 0 0 0 1px rgba(255,255,255,.08), 0 1px 2px rgba(0,0,0,.4), 0 14px 30px -12px rgba(0,0,0,.7); }
  .view img { display: block; width: 420px; }
  .view.cropped::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 64px;
    background: linear-gradient(to bottom, transparent, var(--panel) 92%); }
</style>
</head>
<body>
<div class="frame"><div class="view"><img alt=""></div></div>
<script>
  const q = new URLSearchParams(location.search);
  if (q.get("theme") === "dark") document.body.classList.add("dark");
  const img = document.querySelector("img");
  const view = document.querySelector(".view");
  img.src = q.get("img");
  img.onload = () => {
    const crop = Number(q.get("crop")) || img.naturalHeight;
    view.style.height = Math.min(crop, img.naturalHeight) / 2 + "px";
    if (crop < img.naturalHeight) view.classList.add("cropped");
  };
</script>
</body>
</html>

name: Release marketplace archive
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.14.0
      - run: npm ci
      - run: npm run verify
      - name: Tag must match package.json version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version v$version"
            exit 1
          fi
      - run: python3 scripts/package.py
      - run: gh release create "$GITHUB_REF_NAME" zcode-context-*-marketplace.zip zcode-context-*-marketplace.zip.sha256 --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
